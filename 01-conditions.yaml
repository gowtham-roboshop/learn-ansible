- name: check conditions
  hosts: local
  connection: local
  vars:
   given_number: 10
  tasks:
  - name: printing if even
    debug:
      msg: " given number: {{given_number}} is even "
    when: given_number % 2 == 0

  - name: printing if even
    debug:
      msg: " given number: {{given_number}} is odd "
    when: given_number % 2 != 0

