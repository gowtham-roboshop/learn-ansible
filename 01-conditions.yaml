- name: check conditions
  hosts: local
  connection: local
  vars:
   number: 10
  tasks:
  - name: printing if even
    debug:
      msg: " given {{number}} is even "
    when: {{number}} % 2 == 0

  - name: printing if even
    debug:
      msg: " given {{number}} is odd "
    when: {{number}} % 2 != 0

    